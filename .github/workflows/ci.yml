name: ci

# Por que existe: es la unica vigilancia que sobrevive a que el portatil este apagado. Las tres
# suites y la mutacion se ejecutaban a mano, o sea cuando alguien se acordaba.
#
# La matriz de sistemas no es adorno. `test_portabilidad.py` existe porque este banco nacio en
# Windows y la herramienta normaliza separadores de ruta: en POSIX, el basename del sistema no
# parte por contrabarra y la clasificacion se hundia sin dar error.
#
# Aviso honesto (26/07/2026): esta matriz NUNCA SE HA EJECUTADO. En local solo se ha probado con
# Python 3.14 y 3.13 en Windows, y el README anuncia 3.9+. Un escaneo estatico no encontro sintaxis
# ni biblioteca por encima de 3.9, pero eso encuentra incompatibilidades, no certifica compatibilidad.
# Lo que la certifica es este fichero dando verde, y hasta el primer push no lo ha dado.
#
# YA LO HA DADO (27/07/2026): 9 de 9 trabajos en verde, con 3.9, 3.12 y 3.14 sobre Windows,
# Linux y Mac. El aviso de arriba se queda tachado y no borrado, porque era cierto cuando se
# escribio y su correccion es el dato. La leccion: una nota de humildad tambien caduca, y esta
# caduco EN LA DIRECCION QUE HACE PARECER EL REPOSITORIO PEOR DE LO QUE ES. Lo cazo una
# revision ciega el mismo dia, no nosotros.

on:
  push:
  pull_request:

defaults:
  run:
    working-directory: skills/adherencia-reglas

jobs:

  # EL GUARDIAN DE LOS GEMELOS (27/07/2026). Este repositorio y su hermano publican el mismo
  # codigo, y cada arreglo hay que escribirlo dos veces. Salio bien mientras alguien se acordo. Va
  # en UN solo trabajo y no en la matriz: la comparacion no depende del sistema ni de la version, y
  # multiplicarla por nueve solo gasta peticiones a la API.
  #
  # Entre el push a uno y el push al otro este trabajo sale ROJO A PROPOSITO. Es la unica ventana
  # en la que los dos arboles difieren de verdad, y taparla seria devolver el problema.
  gemelo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Los dos gemelos siguen coincidiendo
        working-directory: .
        run: python test_gemelo.py
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python-version: ["3.9", "3.11", "3.13"]
        # 3.8 SALIO de la matriz el 26/07. `macos-latest` es arm64 desde 2024 y
        # `actions/setup-python` no publica 3.8 para esa arquitectura, asi que ese eje habria
        # fallado en el primer push por el entorno, no por el codigo. Un CI que falla por su
        # propia matriz ensena a ignorar el rojo. El README dice ahora 3.9+, que es lo que
        # este fichero puede certificar.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Biblioteca estandar unicamente: no hay dependencias que instalar.
      - name: Banco de logica
        run: python run_tests_adherencia.py

      - name: Banco de portabilidad
        run: python test_portabilidad.py

      # Este es el que no admite termino medio: nada del historial puede salir en la salida.
      - name: Banco de seguridad
        run: python test_seguridad.py

      - name: La herramienta arranca y responde (exit 0)
        run: python medir_adherencia.py -h

      # La mutacion es lo que separa un banco de un adorno: sabotea el codigo y exige que el banco
      # se ponga rojo. Sale con 1 si algun sabotaje pasa callando.
      - name: Verificacion por mutacion
        run: python mutar.py

      # EL EJEMPLO DEL README SE EJECUTA EN CI. Si deja de reproducirse, el README miente y hay
      # que enterarse aqui, no cuando alguien clone el repo. Es la misma regla que el resto del
      # paquete aplica a las cifras: una tabla publicada es una afirmacion, y se comprueba.
      #
      # Y SE COMPRUEBAN LAS CIFRAS, no solo que el comando termine bien (27/07/2026). Tal como
      # estaba, este paso solo miraba el codigo de salida: si el ejemplo pasaba a dar otros
      # numeros, el CI seguia verde y el README seguia mintiendo, que es exactamente el fallo
      # contra el que se escribio el paso. Se comprueba lo que el README publica: 11 ocasiones
      # con 8 cumplidas para la primera regla, 4 con 1 para la segunda, y el asterisco de muestra
      # corta en la segunda. `grep -F` porque el `%` y el punto no son patron aqui.
      - name: El ejemplo del README se reproduce
        shell: bash
        working-directory: .
        run: |
          python ejemplo/fabricar_ejemplo.py
          python skills/adherencia-reglas/medir_adherencia.py \
            --sesiones ejemplo/historial --reglas ejemplo/reglas_ejemplo.json | tee salida.txt
          grep -F "gate-tras-escribir-doc" salida.txt | grep -Eq "11 +8 +72\.7 %" \
            || { echo "El README publica 11/8/72,7 % y el ejemplo ya no lo da"; exit 1; }
          grep -F "suite-tras-tocar-codigo" salida.txt | grep -Eq "4 +1 +25\.0 %\*" \
            || { echo "El README publica 4/1/25,0 % con asterisco y el ejemplo ya no lo da"; exit 1; }
          echo "Las dos filas del README coinciden con la salida."
